<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Mapa Literário</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rosa:#ffd6e8; --rosa2:#ffb3d1; --azul:#cfe8ff; --azul2:#a9d4ff;
    --roxo:#e3d4ff; --roxo2:#c4a9f5; --texto:#6b5b95; --branco:#fff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:'Quicksand','Segoe UI',system-ui,sans-serif; color:var(--texto);
    background:linear-gradient(135deg,var(--azul),var(--roxo) 50%,var(--rosa));
    display:flex;flex-direction:column;padding:12px;gap:10px;
  }
  header{text-align:center;font-weight:700;font-size:20px;letter-spacing:.5px}
  header small{display:block;font-size:12px;font-weight:500;opacity:.8}
  form{
    display:flex;flex-wrap:wrap;gap:8px;background:var(--branco);
    padding:10px;border-radius:22px;border:3px solid var(--rosa2);
    box-shadow:0 4px 0 var(--roxo2);
  }
  input{
    flex:1 1 150px;min-width:0;padding:10px 14px;border-radius:16px;
    border:2px solid var(--azul2);background:#fbfdff;color:var(--texto);
    font:inherit;outline:none;
  }
  input:focus{border-color:var(--roxo2);background:#fff}
  input::placeholder{color:#b9aedb}
  button{
    font:inherit;font-weight:700;cursor:pointer;border:none;color:#fff;
    background:linear-gradient(135deg,var(--rosa2),var(--roxo2));
    padding:10px 18px;border-radius:16px;box-shadow:0 3px 0 #a88be0;
  }
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #a88be0}
  button:disabled{opacity:.6;cursor:wait}
  #msg{width:100%;font-size:13px;min-height:16px;padding-left:6px}
  #map{
    flex:1;min-height:280px;border-radius:24px;border:4px solid var(--branco);
    box-shadow:0 0 0 3px var(--azul2),0 5px 0 3px var(--roxo2);z-index:1;
  }
  #lista{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px}
  #lista:empty::before{content:"Seus livros vão aparecer aqui ♡";font-size:13px;opacity:.8}
  .chip{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--branco);
    border:2px solid var(--roxo);border-radius:999px;padding:5px 6px 5px 12px;
    font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .chip:hover{border-color:var(--rosa2)}
  .chip b{font-weight:700}
  .chip .x{
    all:unset;cursor:pointer;width:20px;height:20px;line-height:20px;text-align:center;
    border-radius:50%;background:var(--rosa);color:var(--texto);font-size:11px;
  }
  /* pino com coração */
  .pino{position:relative;width:34px;height:34px}
  .pino i{
    position:absolute;inset:0;background:linear-gradient(135deg,var(--rosa2),var(--roxo2));
    border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    box-shadow:0 3px 6px rgba(107,91,149,.45);
  }
  .pino span{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;padding-bottom:3px;
  }
  .leaflet-popup-content-wrapper{border-radius:18px;border:2px solid var(--rosa2);color:var(--texto);font-family:inherit}
  .leaflet-popup-content{margin:12px 14px;line-height:1.4}
  .pop-t{font-weight:700;font-size:15px}
  .pop-d{margin-top:6px;padding:4px 10px;font-size:12px;border-radius:12px;box-shadow:none;background:var(--azul2);color:#fff}
</style>
</head>
<body>
  <header>📖 Meu Mapa Literário <small>cada livro, um cantinho do mundo ♡</small></header>

  <form id="form" autocomplete="off">
    <input id="titulo" placeholder="Título do Livro" required>
    <input id="autor" placeholder="Autor(a)" required>
    <input id="local" placeholder="Cidade / País" required>
    <button id="btn" type="submit">Adicionar ♡</button>
    <div id="msg"></div>
  </form>

  <div id="map"></div>
  <div id="lista"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var KEY = 'mapa-literario-v1';
  var livros = [];
  var marcadores = {};

  // ---- armazenamento (com proteção caso o iframe bloqueie) ----
  function carregar(){
    try { livros = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ livros = []; }
  }
  function salvar(){
    try { localStorage.setItem(KEY, JSON.stringify(livros)); }
    catch(e){ aviso('Não consegui salvar neste navegador 😢', true); }
  }

  // ---- mapa ----
  var map = L.map('map', {worldCopyJump:true}).setView([20, 0], 2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);
  setTimeout(function(){ map.invalidateSize(); }, 300);
  window.addEventListener('resize', function(){ map.invalidateSize(); });

  var icone = L.divIcon({
    className: '',
    html: '<div class="pino"><i></i><span>❤️</span></div>',
    iconSize: [34, 34], iconAnchor: [17, 34], popupAnchor: [0, -34]
  });

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function desenhar(l){
    var m = L.marker([l.lat, l.lng], {icon: icone, title: l.titulo}).addTo(map);
    m.bindPopup(
      '<div class="pop-t">' + esc(l.titulo) + '</div>' +
      '<div>por ' + esc(l.autor) + '</div>' +
      '<div>📍 ' + esc(l.local) + '</div>' +
      '<button class="pop-d" data-id="' + l.id + '">remover</button>'
    );
    marcadores[l.id] = m;
  }

  function lista(){
    var el = document.getElementById('lista');
    el.innerHTML = '';
    livros.forEach(function(l){
      var c = document.createElement('div');
      c.className = 'chip';
      c.innerHTML = '❤️ <b>' + esc(l.titulo) + '</b> · ' + esc(l.local) +
                    ' <button class="x" title="Remover" data-id="' + l.id + '">✕</button>';
      c.onclick = function(e){
        if (e.target.classList.contains('x')) return;
        map.flyTo([l.lat, l.lng], 6);
        marcadores[l.id].openPopup();
      };
      el.appendChild(c);
    });
  }

  function remover(id){
    livros = livros.filter(function(l){ return l.id !== id; });
    if (marcadores[id]){ map.removeLayer(marcadores[id]); delete marcadores[id]; }
    salvar(); lista();
  }

  document.addEventListener('click', function(e){
    var id = e.target.getAttribute && e.target.getAttribute('data-id');
    if (id && (e.target.classList.contains('x') || e.target.classList.contains('pop-d'))) remover(id);
  });

  function aviso(t, erro){
    var m = document.getElementById('msg');
    m.textContent = t; m.style.color = erro ? '#d9608f' : '#6b5b95';
  }

  // ---- geocodificação (Nominatim / OpenStreetMap) ----
  function buscar(local){
    var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=pt&q=' + encodeURIComponent(local);
    return fetch(url).then(function(r){ return r.json(); }).then(function(d){
      if (!d.length) throw new Error('nao achei');
      return {lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon)};
    });
  }

  document.getElementById('form').addEventListener('submit', function(e){
    e.preventDefault();
    var t = document.getElementById('titulo'), a = document.getElementById('autor'), c = document.getElementById('local');
    var btn = document.getElementById('btn');
    btn.disabled = true; aviso('Procurando no mapa... ✨');
    buscar(c.value.trim()).then(function(pos){
      var l = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        titulo: t.value.trim(), autor: a.value.trim(), local: c.value.trim(),
        lat: pos.lat, lng: pos.lng
      };
      livros.push(l); salvar(); desenhar(l); lista();
      map.flyTo([l.lat, l.lng], 5);
      marcadores[l.id].openPopup();
      t.value = a.value = c.value = '';
      aviso('Livro adicionado! ♡');
      t.focus();
    }).catch(function(){
      aviso('Não encontrei esse lugar 🥺 Tente "Cidade, País".', true);
    }).then(function(){ btn.disabled = false; });
  });

  carregar();
  livros.forEach(desenhar);
  lista();
  if (livros.length){
    map.fitBounds(L.latLngBounds(livros.map(function(l){ return [l.lat, l.lng]; })), {padding:[40,40], maxZoom:5});
  }
})();
</script>
</body>
</html>
